name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix phone ZIP
        run: |
          unzip -o "*.zip" || true
          if [ -d "Zwelethemba_AAB_FINAL" ]; then
            cp -r Zwelethemba_AAB_FINAL/* .
          fi
          find . -name "pubspec.yaml" | head -1
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Make Android folder
        run: |
          flutter create . --project-name zwelethemba_chat --org com.zwelethemba --platforms android --overwrite
          unzip -o "*.zip" || true
          if [ -d "Zwelethemba_AAB_FINAL" ]; then
            cp -r Zwelethemba_AAB_FINAL/lib/* lib/ || true
          fi
          ls lib/
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: Zwelethemba-APK-REAL-6850
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zwelethemba-AAB-PLAYSTORE-6850
          path: build/app/outputs/bundle/release/app-release.aab
