name: Build Zwelethemba APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          
      - name: Setup Android + Build
        run: |
          # Save your real code
          cp lib/main.dart /tmp/main.dart.bak || true
          cp pubspec.yaml /tmp/pubspec.bak || true
          
          # Create Android folder
          flutter create . --project-name zwelethemba_chat --org com.zwelethemba --platforms android --overwrite
          
          # Restore your real code
          cp /tmp/main.dart.bak lib/main.dart || true
          cp /tmp/pubspec.bak pubspec.yaml || true
          
          flutter pub get
          flutter build apk --release
          
      - uses: actions/upload-artifact@v4
        with:
          name: Zwelethemba-Chat-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
