name: Build REAL Zweletemba FIXED
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Fix Android V1 - Recreate clean
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name zweletemba_chat --org com.zweletemba.chat --overwrite
          ls lib/main.dart

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: Zweletemba-APK-V2-FIXED-6850
          path: build/app/outputs/flutter-apk/app-release.apk
