name: Build REAL Zweletemba FIXED
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Fix Android V1 embedding - Recreate android folder
        run: |
          flutter --version
          rm -rf android
          flutter create . --platforms=android --project-name zwelethemba_chat
          mkdir -p android/app
          if [ -f "google-services.json" ]; then cp google-services.json android/app/; fi
          unzip -o "*.zip" -d . || true
          if [ -d "Zweletemba_AAB_FINAL" ]; then cp -r Zweletemba_AAB_FINAL/* . 2>/dev/null || true; fi
          if [ -f "Zweletemba_AAB_FINAL/google-services.json" ]; then cp Zweletemba_AAB_FINAL/google-services.json android/app/; fi
          ls lib/
          ls android/app/

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: Zweletemba-APK-REAL-V2-FIXED-6850
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zweletemba-AAB-REAL-V2-FIXED-6850
          path: build/app/outputs/bundle/release/app-release.aab
