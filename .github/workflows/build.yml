name: Build Zwelethemba APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Create Zwelethemba App
        run: |
          rm -rf lib pubspec.yaml || true
          flutter create . --project-name zwelethemba_chat --org com.zwelethemba --platforms android --overwrite
          flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Zwelethemba-Chat-APK
          path: build/app/outputs/flutter-apk/app-release.apk
