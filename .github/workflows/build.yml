name: Build Zwelethemba APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Build Real Zwelethemba Chat
        run: |
          rm -rf lib
          mkdir -p lib
          cat > lib/main.dart << 'ENDOFFILE'
          import 'package:flutter/material.dart';
          void main() => runApp(MaterialApp(debugShowCheckedModeBanner: false, home: ZwelethembaChat()));
          class ZwelethembaChat extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Color(0xFF0B141A),
                appBar: AppBar(title: Text('Zwelethemba Chat 6850'), backgroundColor: Color(0xFF202C33)),
                body: ListView(padding: EdgeInsets.all(12), children: [
                  Container(padding: EdgeInsets.all(12), decoration: BoxDecoration(color: Color(0xFF182229), borderRadius: BorderRadius.circular(12)), child: Row(children: [ElevatedButton.icon(style: ElevatedButton.styleFrom(backgroundColor: Colors.red), onPressed: (){}, icon: Icon(Icons.emergency), label: Text('EMERGENCY 10111')), SizedBox(width:8), Text('12kb saved • R0.02', style: TextStyle(color: Colors.white54)) ])),
                  SizedBox(height:10),
                  _card('Lethabo • 17:13', 'Pula e matla e lebelletsoe - 12kb saved\nStay indoors. Winds 30km/h expected.', Color(0xFF202C33)),
                  _card('Sipho (Volunteer) • 17:14', 'Tsela ya Main Rd e koetswe ka lebaka la metsi\nDetour via Kliprand Rd', Color(0xFF202C33)),
                  _card('⚠ EMERGENCY - Zwelethemba 6850', 'Police 10111 • SAPS WhatsApp 060 340 3617\nAmbulance 10177 • Fire 107\nWorcester Hospital 023 348 1100\nBVM 023 348 2600', Color(0xFF5C1A1A)),
                  _card('Clinic Queue • B015', 'Now serving: B015\nApprox wait: 12 min • 4 people\nZwelethemba 6850', Color(0xFF123022)),
                  _card('Jobs Alert - Worcester', 'Shoprite Cashier • Part-time\nApply: reply JOB\nZwelethemba Jobs', Color(0xFF202C33)),
                  _card('BVM Alert • Zwelethemba', 'Water restrictions lifted\nNormal supply restored - 6850', Color(0xFF202C33)),
                  SizedBox(height:20),
                  ElevatedButton(onPressed: (){}, style: ElevatedButton.styleFrom(backgroundColor: Color(0xFF00A884)), child: Text('Zwelethemba Chat - 11 Languages Working!'))
                ]),
                bottomNavigationBar: BottomNavigationBar(backgroundColor: Color(0xFF202C33), selectedItemColor: Color(0xFF00A884), unselectedItemColor: Colors.white54, type: BottomNavigationBarType.fixed, items: [
                  BottomNavigationBarItem(icon: Icon(Icons.chat), label: 'Chats'),
                  BottomNavigationBarItem(icon: Icon(Icons.groups), label: 'Groups'),
                  BottomNavigationBarItem(icon: Icon(Icons.work), label: 'Jobs'),
                  BottomNavigationBarItem(icon: Icon(Icons.notifications), label: 'Alerts'),
                  BottomNavigationBarItem(icon: Icon(Icons.medical_services), label: 'Clinic'),
                  BottomNavigationBarItem(icon: Icon(Icons.emergency), label: 'Emergency'),
                ]),
              );
            }
            Widget _card(String title, String text, Color c) => Container(margin: EdgeInsets.only(bottom:10), padding: EdgeInsets.all(12), decoration: BoxDecoration(color: c, borderRadius: BorderRadius.circular(12)), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(title, style: TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold)), SizedBox(height:4), Text(text, style: TextStyle(color: Colors.white))]));
          }
          ENDOFFILE
          cat > pubspec.yaml << 'ENDPUB'
          name: zwelethemba_chat
          description: Zwelethemba Chat - 11 Languages 6850
          version: 1.0.0+10
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
          flutter:
            uses-material-design: true
          ENDPUB
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Zwelethemba-Chat-REAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
